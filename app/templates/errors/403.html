{% extends "base.html" %}

{% block title %}403 Forbidden - BlockCert{% endblock %}

{% block content %}
<div class="flex-grow flex items-center justify-center px-4 py-16">
    <div class="bg-surface-container-lowest p-8 rounded-2xl border border-outline-variant/40 shadow-sm max-w-md w-full text-center space-y-4">
        <div class="w-12 h-12 rounded-2xl bg-error-container text-on-error-container inline-flex items-center justify-center">
            <span class="material-symbols-outlined text-2xl fill">lock</span>
        </div>
        <h1 class="text-2xl font-bold text-on-surface">403 - Access Forbidden</h1>
        <p class="text-xs text-on-surface-variant">You do not have permission to view or manage this resource.</p>
        <div class="pt-2">
            <a href="{{ url_for('verify.landing') }}" class="inline-flex items-center gap-2 bg-primary text-on-primary px-5 py-2.5 rounded-xl text-xs font-semibold hover:bg-primary-container">
                Return Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
